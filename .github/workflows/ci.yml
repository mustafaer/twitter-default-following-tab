name: CI

on:
  push:
    branches: [development]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-zip
          path: dist/*.zip
          if-no-files-found: error
