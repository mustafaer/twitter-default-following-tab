<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitter Default Tab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      background: #15202b;
      color: #e7e9ea;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #2f3336;
    }

    .logo {
      width: 32px;
      height: 32px;
    }

    .title {
      flex: 1;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e7e9ea;
      margin-bottom: 2px;
    }

    .version {
      font-size: 12px;
      color: #71767b;
    }

    .setting {
      margin-bottom: 16px;
    }

    .setting-label {
      font-size: 13px;
      font-weight: 600;
      color: #e7e9ea;
      margin-bottom: 8px;
      display: block;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #2f3336;
      border-radius: 8px;
      font-size: 13px;
      color: #e7e9ea;
      background-color: #1e2732;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    select:hover {
      border-color: #1d9bf0;
      background-color: #273340;
    }

    select:focus {
      outline: none;
      border-color: #1d9bf0;
      box-shadow: 0 0 0 2px rgba(29, 155, 240, 0.2);
    }

    option {
      background-color: #1e2732;
      color: #e7e9ea;
    }

    .status {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 12px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .status.show {
      opacity: 1;
    }

    .status.success {
      background-color: #00ba7c;
      color: #ffffff;
    }

    .links {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #2f3336;
    }

    .link-btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #2f3336;
      border-radius: 6px;
      background: #1e2732;
      color: #71767b;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s ease;
      display: block;
    }

    .link-btn:hover {
      background-color: #273340;
      border-color: #1d9bf0;
      color: #1d9bf0;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 24 24" fill="#1d9bf0">
      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </svg>
    <div class="title">
      <h1>Twitter Default Tab</h1>
      <div class="version">v2.0.0</div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="setting">
    <label class="setting-label" for="defaultTabSelect">Default Tab (by position)</label>
    <select id="defaultTabSelect" name="defaultTab">
      <!-- Options will be populated dynamically -->
    </select>
  </div>

  <div class="links">
    <a href="#" class="link-btn" id="settingsBtn">⚙️ Settings</a>
    <a href="https://github.com/mustafaer/twitter-default-following-tab" class="link-btn" target="_blank">⭐ GitHub</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
